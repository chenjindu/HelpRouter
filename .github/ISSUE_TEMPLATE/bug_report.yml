name: Bug Report
description: Something in HelpOS isn't working as expected
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: HelpOS version
      description: The image version you downloaded (shown on the download page), e.g. 1.0.0
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: hardware
    attributes:
      label: Hardware
      description: Board, RAM, storage, WiFi adapter — whatever is relevant
      placeholder: "Raspberry Pi 5 8GB, microSD 32GB, ALFA AWUS036AXML"
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect to happen, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Flash the image and boot
        2. Connect to the hotspot
        3. ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs (optional)
      description: System logs, terminal output, screenshots — anything that helps
      render: shell
